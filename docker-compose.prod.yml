services:
  disco-prod:
    image: disco-prod
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    # No container_name - allows multiple instances
    ports:
      # Expose daemon port (daemon serves both API and UI)
      - '${DAEMON_PORT:-3030}:${DAEMON_PORT:-3030}'
    environment:
      # Daemon configuration
      - NODE_ENV=production
      - DAEMON_PORT=${DAEMON_PORT:-3030}
      - DAEMON_HOST=0.0.0.0
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Explicit fresh-install package policy. The entrypoint defaults to the
      # intentionally tool-free "none" policy when this is omitted.
      - DISCO_AGENTIC_TOOLS=${DISCO_AGENTIC_TOOLS:-none}
      # Optional first-run bootstrap password. If unset on an empty database,
      # Disco writes a random password to /home/disco/.disco/admin-credentials
      # (mode 0600) and logs only that file path.
      - DISCO_ADMIN_PASSWORD=${DISCO_ADMIN_PASSWORD:-}

      # Pass through API keys from host (if set)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Persist entire home directory (database, config, agent auth tokens, etc.)
      - disco-home:/home/disco
      # Mount SSH keys for git authentication (optional)
      # - ~/.ssh:/home/disco/.ssh:ro
    restart: unless-stopped

volumes:
  # Named volume for persistent data
  # Persists: database, config, agent auth tokens, caches, etc.
  disco-home:
